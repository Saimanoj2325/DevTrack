services:
  postgres:
    image: postgres:15-alpine
    container_name: devtrack-postgres
    restart: always
    environment:
      POSTGRES_USER: devtrack
      POSTGRES_PASSWORD: devtrack_password
      POSTGRES_DB: devtrack_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtrack -d devtrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devtrack-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://devtrack:devtrack_password@postgres:5432/devtrack_db?schema=public"
      JWT_SECRET: "super-secret-jwt-key-devtrack"
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devtrack-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
